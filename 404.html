  <script>
    // Single Page Apps for GitHub Pages - 404 handler
    // https://github.com/rafgraph/spa-github-pages
    (function(l) {
      // 如果已经是 /?/ 格式，直接解码并替换历史记录
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
        return;
      }
      
      // 如果是根路径且没有查询参数，不做任何操作（避免循环）
      if (l.pathname === '/' && !l.search && !l.hash) {
        return;
      }
      
      // 如果是 404.html，且不在根路径，重定向到根路径（但只执行一次）
      if (l.pathname === '/404.html') {
        // 使用 sessionStorage 标记，避免循环
        if (!sessionStorage.getItem('404-redirect')) {
          sessionStorage.setItem('404-redirect', 'true');
          window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
          return;
        } else {
          sessionStorage.removeItem('404-redirect');
        }
      }
      
      // 如果是 index.html，重定向到根路径
      if (l.pathname === '/index.html') {
        window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
        return;
      }
      
      // 只在非根路径时才重定向到 /?/ 格式
      var pathSegmentsToKeep = 0;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep);
      if (path.length > 0 && path[0] !== '' && path[0] !== 'index.html' && path[0] !== '404.html') {
        var newPath = '/' + path.join('/').replace(/&/g, '~and~');
        var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/?/' + newPath.slice(1) + search + l.hash
        );
      }
    }(window.location))
  </script>
